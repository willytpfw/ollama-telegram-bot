name: Git Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxis
        run: node --check index.js

      - name: Verificar que axios carga
        run: node -e "require('axios'); console.log('axios OK')"

  hook:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Llamar WebHook
        run: |
          curl --fail -X POST "${{ secrets.HA_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"mensaje":"Build OK: ollama-telegram-bot"}'
