name: Git Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxis
        run: node --check index.js

      - name: Verificar que axios carga
        run: node -e "require('axios'); console.log('axios OK')"
        
  Hook: 
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Llamar WebHook
          if: ${{ success() }}
          run: |
            curl -X POST https://hooks.nabu.casa/gAAAAABqh76ggj_JMSO9ERNexwb0sr5iBtQlhE3-1GOCAr71nTMHTajDYLjc9yYHdDnBpP-00LEcCiKLaaUGwbPDYU-vEefE4NG7XNp4Pk4GzPCr2P6fJ_TW4L6ehL9k8bo9EgPln-0fW8OpjMvNsUtkXU7hEAXsQFbcdRktFIKnp1zKOMyeXLY= \
